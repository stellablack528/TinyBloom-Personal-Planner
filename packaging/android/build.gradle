buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Keep this aligned with the Android Gradle Plugin bundled by Qt.
        classpath 'com.android.tools.build:gradle:8.10.1'
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: qtGradlePluginType

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.core:core:1.16.0'
}

android {
    namespace = androidPackageName
    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion
    ndkVersion = androidNdkVersion

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src', 'java']
            aidl.srcDirs = [qtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    tasks.withType(JavaCompile) {
        options.incremental = true
        options.compilerArgs += ['-Xlint:all']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError = false
    }

    aaptOptions {
        // Qt's resource bundle must remain directly readable.
        noCompress 'rcc'
    }

    // Keep native libraries uncompressed so Android can map them directly
    // from the APK. AGP 8.10 aligns them for 16 KiB page-size devices and this
    // avoids vendor-specific failures in the legacy extraction path.
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    buildTypes {
        release {
            // Qt starts through Java classes loaded by name. Keep the complete
            // bridge for public compatibility builds instead of shrinking it.
            minifyEnabled false
        }
    }

    defaultConfig {
        minSdkVersion qtMinSdkVersion
        targetSdkVersion qtTargetSdkVersion
        ndk.abiFilters = qtTargetAbiList.split(",")
    }
}
