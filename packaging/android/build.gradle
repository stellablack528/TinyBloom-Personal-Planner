buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Keep this aligned with the Android Gradle Plugin bundled by Qt.
        classpath 'com.android.tools.build:gradle:8.10.1'
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: qtGradlePluginType

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.core:core:1.16.0'
}

android {
    namespace = androidPackageName
    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion
    ndkVersion = androidNdkVersion

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src', 'java']
            aidl.srcDirs = [qtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    tasks.withType(JavaCompile) {
        options.incremental = true
        options.compilerArgs += ['-Xlint:all']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError = false
    }

    aaptOptions {
        // Qt's resource bundle must remain directly readable.
        noCompress 'rcc'
    }

    // Compress native libraries inside the APK. Android extracts them during
    // installation, keeping the direct-download package below Gitee's limit.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            // Android explicitly uses Material (see main.cpp). Alternative
            // control styles, release-unused QML debugging helpers, and the
            // JPEG plugin (the project ships only PNG/SVG assets) are omitted
            // to keep the directly downloadable APK compact.
            excludes += [
                '**/*FluentWinUI3*.so',
                '**/*Imagine*.so',
                '**/*Universal*.so',
                '**/*Fusion*.so',
                '**/*QuickControls2Basic*.so',
                '**/*Controls_Basic*.so',
                '**/*qmldbg*.so',
                '**/*qjpeg*.so'
            ]
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    defaultConfig {
        resConfig "en"
        minSdkVersion qtMinSdkVersion
        targetSdkVersion qtTargetSdkVersion
        ndk.abiFilters = qtTargetAbiList.split(",")
    }
}
